services:
  backend:
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: dev               # use the dev stage (npm run dev)
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000}
      WATCHPACK_POLLING: "true"

  proxy:
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro