services:
  db:
    image: postgres:17-alpine
    container_name: lead-desk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leaddesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaddesk_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-leaddesk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leaddesk} -d ${POSTGRES_DB:-leaddesk}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lead-desk-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-leaddesk}:${POSTGRES_PASSWORD:-leaddesk_dev_secret}@db:5432/${POSTGRES_DB:-leaddesk}}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-leaddesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaddesk_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-leaddesk}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_change_in_production_12345}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
